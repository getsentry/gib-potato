steps:
    - name: 'gcr.io/cloud-builders/docker'
      id: setup-buildx
      args:
          [
              'buildx',
              'create',
              '--name',
              'cloudbuild',
              '--driver',
              'docker-container',
              '--bootstrap',
          ]
      waitFor: ['-']
    - name: 'gcr.io/cloud-builders/docker'
      id: build-shopato
      entrypoint: bash
      args: ['docker/cloudbuild/build.sh', 'shopato']
      env: ['PROJECT_ID=$PROJECT_ID', 'COMMIT_SHA=$COMMIT_SHA', 'FORCE_BUILD=$_FORCE_BUILD']
      waitFor: ['setup-buildx']
    - name: 'gcr.io/cloud-builders/docker'
      id: build-potal
      entrypoint: bash
      args: ['docker/cloudbuild/build.sh', 'potal']
      env: ['PROJECT_ID=$PROJECT_ID', 'COMMIT_SHA=$COMMIT_SHA', 'FORCE_BUILD=$_FORCE_BUILD']
      waitFor: ['setup-buildx']
    - name: 'gcr.io/cloud-builders/docker'
      id: build-backend
      entrypoint: bash
      args: ['docker/cloudbuild/build.sh', 'backend']
      env: ['PROJECT_ID=$PROJECT_ID', 'COMMIT_SHA=$COMMIT_SHA', 'FORCE_BUILD=$_FORCE_BUILD']
      secretEnv: ['SENTRY_AUTH_TOKEN']
      waitFor: ['setup-buildx']
    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
      id: deploy-shopato
      entrypoint: bash
      args: ['docker/cloudbuild/deploy.sh', 'shopato']
      waitFor: ['build-shopato']
    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
      id: deploy-potal
      entrypoint: bash
      args: ['docker/cloudbuild/deploy.sh', 'potal']
      waitFor: ['build-potal']
    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
      id: deploy-backend
      entrypoint: bash
      args: ['docker/cloudbuild/deploy.sh', 'backend']
      waitFor: ['build-backend']
    - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
      id: upload-assets
      entrypoint: bash
      args: ['docker/cloudbuild/upload-assets.sh']
      waitFor: ['build-backend']
substitutions:
    # Set to true on a manual run to rebuild all images, e.g. to pick up new base images
    _FORCE_BUILD: 'false'
options:
    machineType: 'E2_HIGHCPU_8'
availableSecrets:
    secretManager:
        - versionName: projects/841923001753/secrets/sentry_auth_token/versions/1
          env: 'SENTRY_AUTH_TOKEN'
